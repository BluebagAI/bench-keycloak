# Benchmark copy of keycloak/keycloak's js-ci.yml admin console end-to-end path as upstream runs
# it on workflow_dispatch (its nightly run): the Build Keycloak job, then the Admin UI E2E job once
# per browser (chromium, firefox). Upstream's pull requests run the chromium job only. Left out on
# every runner: the change-detection job, the lint, unit-test and build jobs of the JS packages, the
# Account UI E2E jobs, the Keycloak Admin Client tests and the status check job.
#
# Same steps and commit on every runner; only the test step differs: Boba runs it with
# coldteadotai/boba, the others run playwright test. js/apps/admin-ui/playwright.config.ts with
# CI=true sets fullyParallel false (files share state in beforeAll, so a file's tests run in order
# and files run in parallel), the default worker count (half the vCPUs: 2 on a 4 vCPU runner), one
# retry, failOnFlakyTests, and a JSON report in playwright-results.json. Rivals run at upstream's
# size (4 vCPU). GitHub runs upstream's ubuntu-latest (ubuntu-26.04); Blacksmith runs its Ubuntu
# 24.04 image, as on every other suite. Upstream's Maven, PNPM and Wireit caches are kept.
#
# Benchmark changes, the same on every runner:
# - the admin client the tests import is built in its own step (upstream's test:integration
#   script builds it through Wireit, then runs playwright test).
# - no concurrency group: upstream's would cancel a run when the next one is dispatched.
name: bench
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where every job runs (github-4 and blacksmith-4 are 4 vCPU, as upstream's runners).
        type: choice
        options: [boba-turbo, boba-standard, github-4, blacksmith-4]

defaults:
  run:
    shell: bash

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

jobs:
  build-keycloak:
    name: Build Keycloak (${{ inputs.runner }})
    runs-on: ${{ startsWith(inputs.runner, 'boba') && 'coldtea-boba' || inputs.runner == 'github-4' && 'ubuntu-26.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Keycloak
        uses: ./.github/actions/build-keycloak

      - name: Prepare archive for upload
        run: |
          mv ./quarkus/dist/target/keycloak-999.0.0-SNAPSHOT.tar.gz ./keycloak-999.0.0-SNAPSHOT.tar.gz

      - name: Upload Keycloak dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keycloak
          path: keycloak-999.0.0-SNAPSHOT.tar.gz
          retention-days: 1

  admin-ui-e2e:
    name: Admin UI E2E ${{ matrix.browser }} (${{ inputs.runner }})
    needs: build-keycloak
    runs-on: ${{ startsWith(inputs.runner, 'boba') && 'coldtea-boba' || inputs.runner == 'github-4' && 'ubuntu-26.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 90
    env:
      WORKSPACE: "@keycloak/keycloak-admin-ui"
    strategy:
      matrix:
        # Upstream excludes firefox unless the run is a workflow_dispatch; this workflow is always one.
        browser: [chromium, firefox]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/pnpm-setup

      - name: Download Keycloak server
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keycloak

      - name: Setup Java
        uses: ./.github/actions/java-setup

      - name: Start Keycloak server
        run: |
          tar xfvz keycloak-999.0.0-SNAPSHOT.tar.gz
          keycloak-999.0.0-SNAPSHOT/bin/kc.sh start-dev --features=admin-fine-grained-authz:v2,transient-users,spiffe,oid4vc-vci,oid4vc-mdoc,kubernetes-service-accounts,jwt-authorization-grant,workflows,ssf,resource-indicators &> ~/server.log &
        env:
          KC_BOOTSTRAP_ADMIN_USERNAME: admin
          KC_BOOTSTRAP_ADMIN_PASSWORD: admin
          KC_BOOTSTRAP_ADMIN_CLIENT_ID: temporary-admin-service
          KC_BOOTSTRAP_ADMIN_CLIENT_SECRET: temporary-admin-service

      - uses: ./.github/actions/playwright-setup
        with:
          workspace: ${{ env.WORKSPACE }}
          browser: ${{ matrix.browser }}

      - name: Wait for Keycloak server to start
        run: curl --connect-timeout 5 --max-time 10 --retry 10 --retry-all-errors --retry-delay 10 --retry-max-time 120 -s -o /dev/null http://127.0.0.1:8080

      # Upstream's test:integration script builds this through Wireit before playwright test.
      - name: Build the admin client
        run: pnpm --fail-if-no-match --filter @keycloak/keycloak-admin-client build
        working-directory: js

      - name: Run Playwright tests on Boba
        if: startsWith(inputs.runner, 'boba')
        uses: coldteadotai/boba@v1
        with:
          working-directory: js/apps/admin-ui
          project: ${{ matrix.browser }}
          turbo: ${{ inputs.runner == 'boba-turbo' }}
          fail-fast: false

      - name: Run Playwright tests
        if: ${{ !startsWith(inputs.runner, 'boba') }}
        run: pnpm exec playwright test --project=${{ matrix.browser }}
        working-directory: js/apps/admin-ui

      - name: Summarize Playwright results
        if: "!cancelled()"
        uses: ./.github/actions/playwright-summary
        with:
          workspace-dir: admin-ui
          title: Admin UI E2E (${{ matrix.browser }})

      - name: Upload Playwright results
        if: ${{ !cancelled() && !startsWith(inputs.runner, 'boba') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ inputs.runner }}-${{ matrix.browser }}
          path: js/apps/admin-ui/playwright-results.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: admin-ui-playwright-report-${{ matrix.browser }}
          path: js/apps/admin-ui/playwright-report
          retention-days: 7

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-ui-server-log-${{ matrix.browser }}
          path: ~/server.log
          retention-days: 7
